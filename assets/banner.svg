<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #cbd5e1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1deg); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes progressAnim {
        0%, 100% { width: 140px; }
        50% { width: 190px; }
      }

      .floating-card-1 { animation: floatCard1 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatCard2 9s ease-in-out infinite reverse; }
      .pulse-bg-1 { animation: pulseAura 5s ease-in-out infinite; transform-origin: 150px 80px; }
      .pulse-bg-2 { animation: pulseAura 6s ease-in-out infinite reverse; transform-origin: 1050px 240px; }
      .animated-dash { stroke-dasharray: 8 8; animation: dashAnim 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Glowing Dynamic Auras in Background -->
  <circle cx="150" cy="80" r="190" fill="url(#glowGrad1)" class="pulse-bg-1"/>
  <circle cx="1050" cy="240" r="230" fill="url(#glowGrad2)" class="pulse-bg-2"/>

  <!-- Faint Matrix Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"/>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320"/>
  </g>

  <!-- Animated Dynamic Card 1 (Objective & Key Result Progress) - Upper Right Background -->
  <g class="floating-card-1" opacity="0.28">
    <rect x="800" y="35" width="310" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="820" y="55" width="130" height="10" rx="5" fill="#38bdf8"/>
    <rect x="820" y="75" width="230" height="8" rx="4" fill="#334155"/>
    <rect x="820" y="93" width="180" height="8" rx="4" fill="#334155"/>
    <!-- Goal Progress Indicator -->
    <rect x="820" y="112" width="260" height="6" rx="3" fill="#1e293b"/>
    <rect x="820" y="112" width="200" height="6" rx="3" fill="#10b981"/>
    <circle cx="1075" cy="58" r="10" fill="#10b981"/>
  </g>

  <!-- Animated Dynamic Card 2 (Cascade Alignment Tree) - Lower Right Background -->
  <g class="floating-card-2" opacity="0.28">
    <rect x="740" y="165" width="340" height="115" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="760" y="185" width="150" height="10" rx="5" fill="#a855f7"/>
    <rect x="760" y="207" width="250" height="8" rx="4" fill="#334155"/>
    <rect x="760" y="225" width="190" height="8" rx="4" fill="#334155"/>
    <rect x="760" y="245" width="260" height="6" rx="3" fill="#1e293b"/>
    <rect x="760" y="245" width="170" height="6" rx="3" fill="#6366f1"/>
    <rect x="1020" y="182" width="45" height="18" rx="9" fill="#6366f1"/>
  </g>

  <!-- Dynamic Curved Connection Line -->
  <path d="M 680 160 Q 740 95 800 95" stroke="url(#accentGrad)" stroke-width="2" fill="none" class="animated-dash" opacity="0.45"/>

  <!-- Top Category Pill -->
  <g transform="translate(80, 48)">
    <rect width="305" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="18" cy="16" r="6" fill="#38bdf8" class="pulse-bg-1"/>
    <text x="34" y="21" class="badge-text">🎯 STRATEGIC GOAL &amp; OKR ECOSYSTEM</text>
  </g>

  <!-- Title & Subtitle (Clear Foreground) -->
  <g transform="translate(80, 138)">
    <text x="0" y="0" class="title" filter="url(#shadow)">Awesome Goal Management 🎯</text>
    <text x="0" y="40" class="subtitle">Curated Directory of Top SaaS Platforms &amp; Open-Source Projects for OKRs &amp; Performance</text>
  </g>

  <!-- Accent Divider Line -->
  <rect x="80" y="232" width="500" height="5" rx="2.5" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Foreground Feature Badges -->
  <g transform="translate(80, 258)">
    <rect x="0" y="0" width="145" height="28" rx="6" fill="#090d16" stroke="#334155"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94a3b8">🏆 Ranked SaaS Directory</text>

    <rect x="160" y="0" width="140" height="28" rx="6" fill="#090d16" stroke="#334155"/>
    <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94a3b8" transform="translate(160, 0)">⭐ Star-Sorted Repos</text>

    <rect x="315" y="0" width="150" height="28" rx="6" fill="#090d16" stroke="#334155"/>
    <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94a3b8" transform="translate(315, 0)">📈 Market Size &amp; Dynamics</text>
  </g>
</svg>
